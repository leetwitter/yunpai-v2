[project]
name = "yunpai-orchestrator"
version = "0.2.0"
description = "云湃工业一体机 · Agent 编排 v2（LangGraph 唯一执行路径，统筹/Worker/审查三角色）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
recognition = ["xlrd>=2.0", "pymupdf>=1.24", "Pillow>=10.0", "python-docx>=1.1", "pypdf>=4.0"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "xlrd>=2.0", "pymupdf>=1.24", "Pillow>=10.0", "python-docx>=1.1", "pypdf>=4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
